<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TouchRoute</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent; color: var(--text);
    font-family: var(--sans); -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  /* The window is an invisible square. Fading the last stretch before its edge
     means a dot that wanders (or bursts) that far dims away instead of being
     cut off along a straight line. */
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: radial-gradient(circle closest-side, #000 calc(100% - 34px), transparent 100%);
    mask-image: radial-gradient(circle closest-side, #000 calc(100% - 34px), transparent 100%);
  }

  /* Text floats over the desktop, so it carries its own soft shadow. */
  .float-text { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7), 0 0 12px rgba(0, 0, 0, 0.45); }

  #readout {
    position: absolute; left: 0; right: 0; bottom: 10px;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 240ms;
  }
  #readout.show { opacity: 1; }
  #code { font: 300 22px/1 var(--display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  #label { margin-top: 4px; font: 400 11px/1.25 var(--sans); color: var(--platinum); padding: 0 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The dial's center: whatever dot you're pointing at. */
  #hub {
    position: absolute; left: 50%; top: 50%; width: 120px; margin-left: -60px; transform: translateY(-50%);
    text-align: center; pointer-events: none; opacity: 0; transition: opacity 500ms;
  }
  body.open #hub { opacity: 1; transition-delay: 700ms; }
  #hubCode { font: 200 30px/1 var(--display); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
  #hubName { margin-top: 6px; font: 500 12px/1.3 var(--sans); color: var(--text); }
  #hubMeta { margin-top: 3px; font: 400 10.5px/1.3 var(--sans); color: var(--platinum); opacity: 0.75; }

  /* A comic speech bubble that pops out of whichever critter is talking. */
  #bubble {
    --tail: 50%;
    position: absolute; left: 0; top: 0; max-width: 188px; width: max-content;
    padding: 7px 12px 8px; border-radius: 16px; border: 2px solid #15151a;
    background: #fffdf6; color: #15151a; text-align: center;
    font: 700 12.5px/1.28 "Chalkboard SE", "Comic Sans MS", "Marker Felt", var(--sans);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.38);
    pointer-events: none; opacity: 0;
    transform: scale(0.3) rotate(-8deg); transform-origin: var(--tail) 115%;
    transition: opacity 180ms, transform 220ms ease-in;
  }
  #bubble.below { transform-origin: var(--tail) -15%; }
  #bubble.show {
    opacity: 1; transform: scale(1) rotate(-1.5deg);
    transition: opacity 100ms, transform 480ms cubic-bezier(0.2, 1.9, 0.4, 1);
  }
  #bubble::before, #bubble::after {
    content: ""; position: absolute; left: var(--tail); width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
  }
  #bubble::before { bottom: -12px; margin-left: -8px; border-top: 11px solid #15151a; border-left-width: 8px; border-right-width: 8px; }
  #bubble::after { bottom: -8px; margin-left: -6px; border-top: 9px solid #fffdf6; border-left-width: 6px; border-right-width: 6px; }
  #bubble.below::before { bottom: auto; top: -12px; border-top: 0; border-bottom: 11px solid #15151a; }
  #bubble.below::after { bottom: auto; top: -8px; border-top: 0; border-bottom: 9px solid #fffdf6; }
  #bubble .later { visibility: hidden; }

  #gear {
    position: absolute; right: 14px; bottom: 14px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(0, 0, 0, 0.35);
    display: grid; place-items: center; cursor: pointer; color: var(--platinum);
    opacity: 0; pointer-events: none; transition: opacity 400ms;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  body.open #gear { opacity: 1; pointer-events: auto; transition-delay: 900ms; }
  #gear:hover { background: rgba(0, 0, 0, 0.55); color: #fff; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bubble" aria-live="polite"><span class="now"></span><span class="later"></span></div>
  <div id="readout" class="float-text"><div id="code"></div><div id="label"></div></div>
  <div id="hub" class="float-text"><div id="hubCode"></div><div id="hubName"></div><div id="hubMeta"></div></div>
  <button id="gear" title="Settings" aria-label="Open settings">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
<script type="module" src="buddy.js"></script>
</body>
</html>
