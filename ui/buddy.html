<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TouchRoute</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent; color: var(--text);
    font-family: var(--sans); -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  /* The body of the creature: a soft black disc that grows into a panel. */
  #shell {
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #17171f, #000 72%);
    border: 1px solid var(--line);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    transition: border-radius 420ms cubic-bezier(.2, .9, .2, 1), border-color 300ms;
  }
  body.open #shell { border-radius: 22px; }
  body.hot #shell { border-color: var(--line-hi); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  #readout {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 160ms;
  }
  #readout.show { opacity: 1; }
  #code { font: 600 30px/1 var(--round); letter-spacing: -0.02em; }
  #label { margin-top: 6px; font: 500 11px/1.25 var(--sans); color: var(--dim); padding: 0 26px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #list {
    position: absolute; inset: 6px; padding: 20px 18px 16px 22px;
    opacity: 0; pointer-events: none; transition: opacity 220ms;
    display: flex; flex-direction: column;
  }
  body.open #list { opacity: 1; pointer-events: auto; transition-delay: 160ms; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { margin: 0; font: 600 15px/1 var(--round); }
  header p { margin: 4px 0 0; font-size: 11px; color: var(--dim); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--raised); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--raised-hi); }
  #rows { flex: 1; overflow-y: auto; margin-right: -8px; padding-right: 8px; scrollbar-width: none; }
  #rows::-webkit-scrollbar { display: none; }
  .group { margin-bottom: 10px; }
  .group h2 { margin: 0 0 2px; font: 500 11px/1 var(--sans); color: var(--faint); padding: 6px 0; }
  .row {
    display: grid; grid-template-columns: 18px 38px 1fr; align-items: center; gap: 6px;
    height: 30px; border-radius: 8px; padding: 0 6px; margin: 0 -6px; cursor: pointer;
  }
  .row:hover { background: var(--raised); }
  .row .pin { width: 10px; height: 10px; } /* dot lands here */
  .row .c { font: 600 13px/1 var(--round); color: var(--dim); }
  .row .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { margin: auto 0; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.5; }
  .empty button {
    margin-top: 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-hi);
    background: var(--raised-hi); cursor: pointer;
  }
  footer { font-size: 10.5px; color: var(--faint); padding-top: 8px; text-align: center; }
  body.paused #shell { filter: saturate(0.2) brightness(0.7); }
</style>
</head>
<body>
  <div id="shell"></div>
  <canvas id="c"></canvas>
  <div id="readout"><div id="code"></div><div id="label"></div></div>
  <div id="list">
    <header>
      <div>
        <h1>Your touches</h1>
        <p id="sub"></p>
      </div>
      <button class="icon-btn" id="gear" title="Settings" aria-label="Open settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div id="rows"></div>
    <footer>Double-click or scroll down to shrink</footer>
  </div>
<script type="module" src="buddy.js"></script>
</body>
</html>
